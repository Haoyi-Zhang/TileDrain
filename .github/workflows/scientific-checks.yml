name: Scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MIN_EXPECTED_PYTHON_SOURCES: '19'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check materials and reproduce the complete finite campaign
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p063-check-logs"
          export P063_OUTPUT="$RUNNER_TEMP/p063-scientific-output"
          timeout --signal=TERM --kill-after=10s 720s bash -c '
            set -euo pipefail
            ulimit -v 3145728
            ulimit -t 600
            python -B .github/scripts/check_repository.py
            python -B tests/lane_regression.py
            python -B reproduce.py --output "$P063_OUTPUT"
          ' 2>&1 | tee "$RUNNER_TEMP/p063-check-logs/run.log"
      - name: Preserve raw results and diagnostics, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p063-scientific-output
          path: |
            ${{ runner.temp }}/p063-check-logs/
            ${{ runner.temp }}/p063-scientific-output/
          if-no-files-found: warn
          retention-days: 14
